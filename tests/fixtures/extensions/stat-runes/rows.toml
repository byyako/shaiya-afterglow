# Items 100/221 to 226 (the empty "???177" of both copies of Item.SData, grade 999 already): copies of the Recreation Rune 100/171 in
# every column (special 62, a stack of 255), grade 999 (no monster drops them). Each redraws one of the item's crafted numbers, the
# smaller of two draws up to the item's top, as the core's rune does for all nine; the item's other numbers and its enchant step stay.
# Disabled, each is an ordinary Recreation Rune.

[[item]]
id = "100/221"
copy = { from = "100/171" }
set = { itemname = "STR Recreation Rune", grade = 999 }
effect = { type = "recreate", stats = ["str"], value = "random" }
client = { name = "STR Recreation Rune", look = "100/171", description = "Draws a new value for the item's STR (only), as a Recreation Rune does." }
note = "stat-runes: str"

