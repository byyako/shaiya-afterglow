[package]
name = "bot"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bot"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
dotenvy = "0.15.7"
game-server = { version = "0.4.0-dev", path = "../game-server" }
login-server = { version = "0.4.0-dev", path = "../login-server" }
rand = "0.9"
serde_json = "1"
shaiya-crypto = { version = "0.4.0-dev", path = "../shaiya-crypto" }
shaiya-proto = { version = "0.4.0-dev", path = "../shaiya-proto" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
sha2 = "0.11.1"
