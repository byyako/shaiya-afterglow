<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NewShaiya data editor</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --line: #d5d9e0; --text: #1c2330; --dim: #667085; --accent: #2f6fed; --accent-text: #ffffff;
  --ok: #1f8a4c; --warn: #b7791f; --bad: #c0392b; --input: #ffffff; --edited: #fff3cd; --pending: #dbeafe; --canvas: #20242c;
  --live: #1f8a4c; --next: #b7791f; --restart: #c0392b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --panel: #1c2027; --line: #333a45; --text: #e4e8ef; --dim: #8b95a5; --accent: #5b8def; --accent-text: #0b1020;
    --ok: #4cc380; --warn: #e0a84a; --bad: #ef6a5b; --input: #12151a; --edited: #4a3f17; --pending: #1b3355; --canvas: #0e1014;
    --live: #4cc380; --next: #e0a84a; --restart: #ef6a5b;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
header { display: flex; gap: 10px; align-items: center; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0 8px 0 0; }
header .sp { flex: 1; }
button, input, select { font: inherit; color: var(--text); }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 3px 9px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button.danger { color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
input, select { background: var(--input); border: 1px solid var(--line); border-radius: 4px; padding: 2px 5px; }
input[type=number] { width: 90px; }
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
main { flex: 1; display: grid; grid-template-columns: 190px minmax(300px, 1fr) 540px; min-height: 0; }
#maplist { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#maplist input { margin: 6px; }
#maprows { overflow: auto; flex: 1; }
.maprow { padding: 3px 8px; cursor: pointer; display: flex; gap: 6px; border-left: 3px solid transparent; }
.maprow:hover { background: var(--bg); }
.maprow.sel { background: var(--pending); border-left-color: var(--accent); }
.maprow .id { width: 24px; text-align: right; color: var(--dim); }
.maprow .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.maprow .meta { color: var(--dim); font-size: 11px; }
#center { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 4px 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
#toolbar label { display: inline-flex; gap: 3px; align-items: center; cursor: pointer; }
#toolbar .grp { display: inline-flex; gap: 6px; align-items: center; padding-right: 10px; border-right: 1px solid var(--line); }
#toolbar .tool.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
#mapname { font-weight: 600; }
#canvaswrap { flex: 1; position: relative; min-height: 0; background: var(--canvas); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#tip { position: absolute; pointer-events: none; background: rgba(15,18,25,.92); color: #fff; padding: 3px 7px; border-radius: 4px; font-size: 12px; display: none; max-width: 340px; z-index: 5; white-space: pre-wrap; }
#status { padding: 2px 8px; color: var(--dim); background: var(--panel); border-top: 1px solid var(--line); font-size: 12px; min-height: 22px; }
#panel { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
#tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 6px 9px; background: none; }
#tabs button.on { border-bottom-color: var(--accent); font-weight: 600; }
#body { flex: 1; overflow: auto; padding: 8px 10px; min-height: 0; }
footer { display: flex; gap: 10px; align-items: center; padding: 6px 12px; background: var(--panel); border-top: 1px solid var(--line); }
footer .sp { flex: 1; }
footer .count { font-weight: 600; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 2px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--dim); font-weight: 500; font-size: 12px; position: sticky; top: 0; background: var(--panel); }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--bg); }
tr.sel td { background: var(--pending); }
.dim { color: var(--dim); }
.small { font-size: 12px; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
h3 { margin: 12px 0 4px; font-size: 13px; }
h3:first-child { margin-top: 0; }
.note { background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; margin: 6px 0; }
.warn { border-color: var(--warn); }
.fgrid { display: grid; grid-template-columns: max-content 1fr; gap: 3px 8px; align-items: center; }
.fgrid label { color: var(--dim); display: flex; gap: 4px; align-items: center; }
.fgrid .cell { display: flex; gap: 4px; align-items: center; }
.fgrid input { width: 100%; max-width: 190px; }
input.edited { background: var(--edited); }
input.pending { background: var(--pending); border-style: dashed; }
input.bad { border-color: var(--bad); }
.eff { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
.eff.live { background: var(--live); } .eff.next { background: var(--next); } .eff.restart { background: var(--restart); }
.pill { font-size: 11px; padding: 0 6px; border-radius: 9px; border: 1px solid var(--line); }
.pill.live { color: var(--live); border-color: var(--live); } .pill.next { color: var(--next); border-color: var(--next); } .pill.restart { color: var(--restart); border-color: var(--restart); }
a.link, .link { color: var(--accent); cursor: pointer; text-decoration: none; }
a.link:hover { text-decoration: underline; }
.reset { padding: 0 4px; line-height: 1.2; }
#modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-start; justify-content: center; padding-top: 6vh; z-index: 20; }
#modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; width: min(760px, 94vw); max-height: 86vh; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
#modal .box h2 { margin: 0 0 8px; font-size: 15px; }
#modal .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
#modal .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
#toast { position: fixed; left: 50%; bottom: 56px; transform: translateX(-50%); z-index: 30; display: flex; flex-direction: column; gap: 6px; align-items: center; }
#toast div { background: #20242c; color: #fff; padding: 7px 14px; border-radius: 6px; max-width: 80vw; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
#toast div.err { background: #8e2a20; }
@media (max-width: 1000px) { main { grid-template-columns: 150px 1fr; } #panel { grid-column: 1 / -1; height: 45vh; border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>NewShaiya data editor</h1>
  <label class="small dim">Your name <input id="who" size="12" placeholder="web"></label>
  <span class="sp"></span>
  <span class="small dim">changes take effect:</span>
  <span class="small"><span class="eff live"></span> live</span>
  <span class="small"><span class="eff next"></span> next spawn</span>
  <span class="small"><span class="eff restart"></span> restart</span>
  <button id="b-servers">Servers</button>
  <button id="b-history">History</button>
  <a class="link small" href="/api/export" download="edits.json">Export</a>
</header>
<main>
  <aside id="maplist"><input id="mapfilter" placeholder="Filter maps"><div id="maprows"></div></aside>
  <section id="center">
    <div id="toolbar"></div>
    <div id="canvaswrap"><canvas id="cv"></canvas><div id="tip"></div></div>
    <div id="status"></div>
  </section>
  <aside id="panel"><nav id="tabs"></nav><div id="body"></div></aside>
</main>
<footer id="draftbar"></footer>
<div id="modal"><div class="box" id="modalbox"></div></div>
<div id="toast"></div>
<script>
'use strict';
// ---------------------------------------------------------------- state and helpers
const S = {
  targets: {}, maps: [], mapId: null, map: null, edits: { fields: [], rows: [] }, draft: [],
  view: null, layers: { image: true, blocked: true, grid: true, areas: true, npcs: true, portals: true, binds: true, obelisks: true, bosses: true },
  opacity: 1, tab: 'monsters', sel: null, mobId: null, gradeOpen: null, itemQ: '', itemResults: null, tool: 'select', marker: null,
  img: null, blocked: null, mobCache: {}, gradeCache: {}, drag: null, drawRect: null, filter: '',
};
let D = {}, R = {}, E = {}, ADDS = [];   // draft: last set per field / removed rows / edits in force / added rows
const $ = (s) => document.querySelector(s);

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}

async function api(method, path, body) {
  const opt = { method, headers: {} };
  if (method !== 'GET') { opt.headers['Content-Type'] = 'application/json'; opt.headers['X-Editor'] = '1'; opt.body = JSON.stringify(body ?? {}); }
  const r = await fetch('/api' + path, opt);
  const t = await r.text();
  let j = null; try { j = JSON.parse(t); } catch (e) { /* not JSON */ }
  if (!r.ok) throw new Error(j && j.error ? j.error : r.status + ' ' + t.slice(0, 200));
  return j;
}

function toast(text, bad) {
  const d = h('div', { class: bad ? 'err' : '' }, text);
  $('#toast').append(d);
  setTimeout(() => d.remove(), bad ? 9000 : 6000);
}

function who() { return ($('#who').value || '').trim() || 'web'; }
const mapName = (id) => { const m = S.maps.find((m) => m.id === id); return m && m.name ? m.name : 'map ' + id; };
const fmt = (n) => (typeof n === 'number' && !Number.isInteger(n)) ? String(Math.round(n * 100) / 100) : String(n);
const r1 = (v) => Math.round(v * 10) / 10;
function fmtSecs(s) {
  if (s == null) return '?';
  if (s < 60) return s + ' s';
  if (s < 3600) return fmt(s / 60) + ' min';
  if (s < 86400) return fmt(s / 3600) + ' h';
  return fmt(s / 86400) + ' d';
}
const effClass = (e) => e === 'live' ? 'live' : e === 'next spawn' ? 'next' : 'restart';
const effDot = (e) => h('span', { class: 'eff ' + effClass(e), title: e === 'live' ? 'live: after a reload' : e === 'next spawn' ? 'next spawn: after a reload, for monsters spawned later' : 'needs a restart' });

function modal(title, content, buttons) {
  const box = $('#modalbox');
  box.replaceChildren(h('h2', {}, title), content, h('div', { class: 'btns' }, buttons || [h('button', { onclick: closeModal }, 'Close')]));
  $('#modal').style.display = 'flex';
}
function closeModal() { $('#modal').style.display = 'none'; $('#modalbox').replaceChildren(); }
$('#modal').addEventListener('mousedown', (e) => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

function confirmBox(title, content, okText, danger) {
  return new Promise((resolve) => {
    modal(title, content, [
      h('button', { onclick: () => { closeModal(); resolve(false); } }, 'Cancel'),
      h('button', { class: danger ? 'primary danger' : 'primary', onclick: () => { closeModal(); resolve(true); } }, okText || 'OK'),
    ]);
  });
}

// ---------------------------------------------------------------- the draft, the edits in force
function indexDraft() {
  D = {}; R = {}; ADDS = [];
  for (const l of S.draft) {
    if (l.action === 'set') D[`${l.target}|${l.key}|${l.field}`] = { value: l.value, seq: l.seq };
    else if (l.action === 'unset') D[`${l.target}|${l.key}|${l.field}`] = { unset: true, seq: l.seq };
    else if (l.action === 'remove') R[`${l.target}|${l.key}`] = l.seq;
    else if (l.action === 'add') ADDS.push(l);
  }
  E = {};
  for (const f of S.edits.fields) E[`${f.target}|${f.key}|${f.field}`] = f;
}
function ov(t, key, field, base) {
  const d = D[`${t}|${key}|${field}`];
  if (!d) return base;
  if (d.unset) { const e = E[`${t}|${key}|${field}`]; return e ? e.original : base; }
  return d.value;
}
const pend = (t, key, field) => !!D[`${t}|${key}|${field}`];

async function refreshDraft() {
  S.draft = await api('GET', '/draft');
  indexDraft();
}
async function refreshEdits() {
  S.edits = await api('GET', '/edits');
  indexDraft();
}

async function stage(lines) {
  try {
    await api('POST', '/draft', { by: who(), lines });
    await refreshDraft();
  } catch (e) {
    toast(e.message, true);
  }
  renderAll();
}

// ---------------------------------------------------------------- field editing
function fmtVal(v) { return v == null ? '' : Array.isArray(v) ? v.map(fmt).join(',') : fmt(v); }
function parseVal(f, text) {
  const k = f.kind.type;
  if (k === 'mobs' || k === 'spots') {
    const parts = text.split(/[\s,]+/).filter((p) => p !== '').map(Number);
    return parts.length && parts.every((n) => Number.isFinite(n)) ? parts : undefined;
  }
  if (text.trim() === '') return undefined;
  const n = Number(text);
  return Number.isFinite(n) ? n : undefined;
}
function fieldMeta(tname, name) { return S.targets[tname].fields.find((f) => f.name === name); }
function kindHint(f) {
  const k = f.kind;
  switch (k.type) {
    case 'int': return `whole number ${k.min} to ${k.max}`;
    case 'coord': return k.axis === 'y' ? 'height' : `${k.axis} inside the map`;
    case 'radius': return 'greater than 0';
    case 'mob': return 'a monster id that can spawn';
    case 'map': return 'a map id';
    case 'drop_rate': return '0 to 100 (entries 1 to 6, a percent) or 0 to 1,000,000 (entries 7 to 9, per million)';
    case 'portal_country': return '0 everyone, 1 Light, 2 Fury, above 1000 an instance portal';
    case 'mobs': return 'monster ids, comma separated' + (k.first_required ? ' (the first must spawn)' : ' (0 = none)');
    case 'spots': return 'nine numbers: three spots of x, y, z';
  }
  return '';
}

// One input for a field of a row: shows the draft's value when there is one, marks edits in force, resets to the original.
function fieldInput(tname, key, f, base, opts) {
  opts = opts || {};
  const cur = ov(tname, key, f.name, base);
  const d = D[`${tname}|${key}|${f.name}`];
  const e = E[`${tname}|${key}|${f.name}`];
  const text = fmtVal(cur);
  const input = h('input', {
    value: text, class: d ? 'pending' : e ? 'edited' : '', disabled: f.nullable && cur == null,
    title: `${f.name}: ${kindHint(f)}` + (e ? `\nedited; original ${fmtVal(e.original)}` : '') + (d ? '\nin the draft' : ''),
    size: opts.size || (f.kind.type === 'mobs' || f.kind.type === 'spots' ? 24 : 9),
  });
  input.addEventListener('change', () => {
    const v = parseVal(f, input.value);
    if (v === undefined) { input.classList.add('bad'); toast(`${f.name}: not a valid value (${kindHint(f)})`, true); return; }
    input.classList.remove('bad');
    stage([{ target: tname, key, action: 'set', field: f.name, value: v }]);
  });
  const cell = h('span', { class: 'cell' }, input);
  if (d || e) {
    cell.append(h('button', {
      class: 'reset', title: d ? 'take this change out of the draft' : `back to the original (${fmtVal(e.original)})`,
      onclick: async () => {
        if (d) { try { await api('DELETE', '/draft/' + d.seq); await refreshDraft(); } catch (err) { toast(err.message, true); } renderAll(); }
        else stage([{ target: tname, key, action: 'unset', field: f.name }]);
      },
    }, '↺'));
  }
  return cell;
}

// Labelled inputs for some fields of a row; `groups` = [[title, [field names]]].
function rowEditor(tname, key, row, groups) {
  const T = S.targets[tname];
  const out = [];
  for (const [title, names] of groups) {
    if (title) out.push(h('h3', {}, title));
    const grid = h('div', { class: 'fgrid' });
    for (const n of names) {
      const f = fieldMeta(tname, n);
      if (!f) { grid.append(h('label', {}, n), h('span', { class: 'dim' }, fmtVal(row[n]))); continue; }
      grid.append(h('label', { title: kindHint(f) }, effDot(f.effect), f.name), fieldInput(tname, key, f, row[n]));
    }
    out.push(grid);
  }
  return out;
}

// ---------------------------------------------------------------- monsters
function mobName(id) {
  if (!id) return '-';
  const info = S.map && S.map.mob_info[id];
  if (info) return info.name;
  const m = S.mobCache[id];
  if (m === undefined) { S.mobCache[id] = null; api('GET', '/mobs/' + id).then((r) => { S.mobCache[id] = r; renderPanel(); }).catch(() => { S.mobCache[id] = false; }); return '…'; }
  return m ? m.def.mobname : '?';
}
const mobLevel = (id) => { const i = S.map && S.map.mob_info[id]; return i ? i.level : null; };

async function openMob(id) {
  S.mobId = id; S.tab = 'monsters'; S.gradeOpen = null;
  try { S.mobCache[id] = await api('GET', '/mobs/' + id); } catch (e) { toast(e.message, true); S.mobId = null; }
  renderAll();
}
async function loadGrade(g) {
  if (S.gradeCache[g] === undefined) {
    S.gradeCache[g] = null;
    api('GET', '/grades/' + g).then((r) => { S.gradeCache[g] = r; renderPanel(); }).catch(() => { S.gradeCache[g] = false; });
  }
  return S.gradeCache[g];
}
async function openGrade(g) {
  S.tab = 'items'; S.gradeOpen = g;
  try { S.gradeCache[g] = await api('GET', '/grades/' + g); } catch (e) { toast(e.message, true); S.gradeOpen = null; }
  renderAll();
}

function monstersTab(b) {
  if (S.mobId != null) return mobDetail(b);
  const open = h('input', { type: 'number', placeholder: 'monster id', style: 'width:110px' });
  b.append(h('div', { class: 'row small' }, 'Open any monster: ', open, h('button', { onclick: () => open.value && openMob(+open.value) }, 'Open')));
  if (!S.map) return;
  const ms = S.map.monsters;
  b.append(h('p', { class: 'dim small' }, `${ms.length} different monsters spawn on this map. Drops belong to the monster everywhere, not to the map.`));
  const t = h('table', {}, h('thead', {}, h('tr', {}, ['id', 'name', 'lvl', 'HP', 'EXP', 'gold', 'respawn', 'here', 'also on'].map((x) => h('th', {}, x)))));
  const tb = h('tbody');
  for (const m of ms) {
    const other = m.other_maps.length ? m.other_maps.slice(0, 6).join(', ') + (m.other_maps.length > 6 ? ' …' : '') : '';
    tb.append(h('tr', { class: 'click', onclick: () => openMob(m.mobid) },
      h('td', { class: 'num' }, m.mobid), h('td', {}, m.name), h('td', { class: 'num' }, m.level), h('td', { class: 'num' }, m.hp), h('td', { class: 'num' }, m.exp),
      h('td', { class: 'num' }, m.money1 || m.money2 ? `${m.money1}+${m.money2}` : ''), h('td', {}, fmtSecs(m.respawn_secs)),
      h('td', { class: 'num', title: `${m.here} monsters in ${m.areas} areas` }, `${m.here}/${m.areas}`), h('td', { class: 'dim small' }, other)));
  }
  t.append(tb); b.append(t);
}

function mobDetail(b) {
  const id = S.mobId, r = S.mobCache[id];
  b.append(h('div', { class: 'row' }, h('a', { class: 'link', onclick: () => { S.mobId = null; renderAll(); } }, '← monsters')));
  if (!r) { b.append('loading…'); return; }
  const def = r.def;
  b.append(h('h3', {}, `${id} ${def.mobname}`, h('span', { class: 'dim' }, `  level ${def.level}, respawn ${fmtSecs(def.respawn_secs)}`)));
  if (r.maps.length) {
    const other = r.maps.filter((m) => m.map !== S.mapId);
    b.append(h('div', { class: 'note small' }, `Spawns on ${r.maps.map((m) => `${mapName(m.map)} (${m.count} in ${m.areas} areas)`).join('; ')}.`,
      other.length ? h('div', { class: 'warn' }, ' Its drops are the same on every map: a change here applies to maps ' + r.maps.map((m) => m.map).join(', ') + '.') : ''));
  }
  b.append(h('h3', {}, 'Drops'));
  const t = h('table', {}, h('thead', {}, h('tr', {}, ['#', 'grade', 'chance', 'of the grade', 'per item', ''].map((x) => h('th', {}, x)))));
  const tb = h('tbody');
  for (const dr of r.drops) {
    const key = `${id}/${dr.order}`;
    const gf = fieldMeta('mob_drop', 'grade'), rf = fieldMeta('mob_drop', 'droprate');
    const grade = ov('mob_drop', key, 'grade', dr.grade), rate = ov('mob_drop', key, 'droprate', dr.droprate);
    const gi = grade ? S.gradeCache[grade] : null;
    if (grade && gi === undefined) loadGrade(grade);
    const items = gi ? gi.items : [];
    const pct = dr.order <= 6 ? rate : rate / 10000;
    const per = items.length ? pct / items.length : 0;
    const sample = items.slice(0, 12).map((i) => i.name + (i.limited ? ' (limited: never drops)' : '')).join('\n') + (items.length > 12 ? '\n…' : '');
    tb.append(h('tr', {},
      h('td', { class: 'num dim' }, dr.order), h('td', {}, fieldInput('mob_drop', key, gf, dr.grade, { size: 5 })),

// ---------------------------------------------------------------- spawn areas
function effAreas() {
  if (!S.map) return [];
  const m = S.mapId, out = [];
  const adds = (key) => ADDS.filter((l) => l.target === 'spawn_mob' && l.key.startsWith(key + '/')).map((l) => ({ seq: +l.key.split('/')[2], mob_id: l.value.mob_id, count: l.value.count, added: true, key: l.key }));
  const build = (a, key, added) => {
    const g = {};
    for (const f of ['x1', 'y1', 'z1', 'x2', 'y2', 'z2']) g[f] = ov('spawn_area', key, f, a[f]);
    const mobs = [];
    for (const mb of a.mobs || []) {
      const mk = `${key}/${mb.seq}`;
      mobs.push({ seq: mb.seq, key: mk, mob_id: ov('spawn_mob', mk, 'mob_id', mb.mob_id), count: ov('spawn_mob', mk, 'count', mb.count), removed: !!R[`spawn_mob|${mk}`], pending: pend('spawn_mob', mk, 'mob_id') || pend('spawn_mob', mk, 'count') });
    }
    for (const x of adds(key)) { x.mob_id = ov('spawn_mob', x.key, 'mob_id', x.mob_id); x.count = ov('spawn_mob', x.key, 'count', x.count); mobs.push(x); }
    return { seq: +key.split('/')[1], key, ...g, mobs, removed: !!R[`spawn_area|${key}`], added, pending: added || ['x1', 'y1', 'z1', 'x2', 'y2', 'z2'].some((f) => pend('spawn_area', key, f)) };
  };
  for (const a of S.map.areas) out.push(build(a, `${m}/${a.seq}`, false));
  for (const l of ADDS) if (l.target === 'spawn_area' && l.key.startsWith(m + '/')) out.push(build({ ...l.value, mobs: [] }, l.key, true));
  return out;
}
const areaTotal = (a) => a.mobs.filter((x) => !x.removed).reduce((n, x) => n + x.count, 0);
function areaLevel(a) {
  let n = 0, sum = 0;
  for (const x of a.mobs) { if (x.removed) continue; const lv = mobLevel(x.mob_id); if (lv != null) { n += x.count; sum += lv * x.count; } }
  return n ? sum / n : null;
}
const areaSummary = (a) => a.mobs.filter((x) => !x.removed).map((x) => `${mobName(x.mob_id)}×${x.count}`).join(', ');
function nextAreaSeq() {
  let top = 99999;
  for (const a of effAreas()) top = Math.max(top, a.seq);
  return top + 1;
}

function loadPictures(id) {

    const img = new Image();

    img.src = `/api/maps/${id}/image?t=${encodeURIComponent(S.map.image.added_at)}`;
  }
  fetch(`/api/maps/${id}/blocked`).then(async (r) => {
    if (!r.ok) return;
    const size = +r.headers.get('x-map-size'), bits = new Uint8Array(await r.arrayBuffer());
    const cv = document.createElement('canvas'); cv.width = cv.height = size;
    const ctx = cv.getContext('2d'), data = ctx.createImageData(size, size);
    let count = 0;
    for (let i = 0; i < size * size; i++) if ((bits[i >> 3] >> (i & 7)) & 1) { const o = i * 4; data.data[o] = 255; data.data[o + 1] = 120; data.data[o + 2] = 60; data.data[o + 3] = 110; count++; }
    ctx.putImageData(data, 0, 0);
    if (S.mapId === id) { S.blocked = { canvas: cv, count, size }; drawMap(); }
  }).catch(() => { /* the layer is optional */ });
}

const cv = $('#cv'), ctx = cv.getContext('2d');
function orient() {
  const im = S.map && S.map.image;
  return { xRight: im ? im.x1 < im.x2 : true, zUp: im ? im.z1 > im.z2 : true };
}
function canvasSize() { const r = cv.getBoundingClientRect(); return [r.width, r.height]; }
function fitView() {
  if (!S.map) return;
  const [W, H] = canvasSize(), size = S.map.map.size, o = orient();
  const s = Math.min(W, H) / size * 0.96;
  S.view = { s, tx: W / 2 - (o.xRight ? 1 : -1) * size / 2 * s, tz: H / 2 - (o.zUp ? -1 : 1) * size / 2 * s };
}
function w2s(x, z) { const o = orient(), v = S.view; return [v.tx + (o.xRight ? 1 : -1) * x * v.s, v.tz + (o.zUp ? -1 : 1) * z * v.s]; }
function s2w(px, py) { const o = orient(), v = S.view; return [(px - v.tx) / ((o.xRight ? 1 : -1) * v.s), (py - v.tz) / ((o.zUp ? -1 : 1) * v.s)]; }
function centerOn(x, z, zoomIn) {

  const o = orient();

// ---------------------------------------------------------------- the lists and panels
function drawMapList() {
  const rows = $('#maprows'), f = S.filter.toLowerCase();
  rows.replaceChildren(...S.maps.filter((m) => !f || String(m.id) === f || (m.name || '').toLowerCase().includes(f) || ('map ' + m.id).includes(f)).map((m) =>
    h('div', { class: 'maprow' + (m.id === S.mapId ? ' sel' : ''), onclick: () => loadMap(m.id), title: `${m.map_type === 'D' ? 'dungeon' : 'field'}, size ${m.size}, ${m.areas} spawn areas, ${m.monsters} different monsters, ${m.portals} portals` },
      h('span', { class: 'id' }, m.id), h('span', { class: 'nm' }, m.name || (m.map_type === 'D' ? 'dungeon' : 'field')), h('span', { class: 'meta' }, m.monsters, m.has_image ? ' 🖼' : ''))));
}

function drawToolbar() {
  const tb = $('#toolbar');
  tb.replaceChildren();
  if (!S.map) { tb.append(h('span', { class: 'dim' }, S.mapId == null ? 'Pick a map on the left.' : 'loading…')); return; }
  const m = S.map.map;
  tb.append(h('span', { class: 'grp' }, h('span', { id: 'mapname' }, `${m.id} ${m.name || ''}`), h('button', { title: 'name this map (shown here only)', onclick: renameMap }, '✎'), h('span', { class: 'dim small' }, `${m.map_type === 'D' ? 'dungeon' : 'field'} ${m.size}`)));
  tb.append(h('span', { class: 'grp' }, [['image', 'picture'], ['blocked', 'blocked'], ['grid', 'grid'], ['areas', 'spawns'], ['npcs', 'NPCs'], ['portals', 'portals'], ['binds', 'bind'], ['obelisks', 'obelisks'], ['bosses', 'bosses']].map(([k, label]) =>
    h('label', {}, h('input', { type: 'checkbox', checked: S.layers[k], onchange: (e) => { S.layers[k] = e.target.checked; drawMap(); } }), label))));
  if (m && S.map.image) tb.append(h('span', { class: 'grp small' }, 'opacity ', h('input', { type: 'range', min: 0.1, max: 1, step: 0.05, value: S.opacity, oninput: (e) => { S.opacity = +e.target.value; drawMap(); } })));
  tb.append(h('span', { class: 'grp' }, h('button', { class: 'tool' + (S.tool === 'newarea' ? ' on' : ''), onclick: () => { S.tool = S.tool === 'newarea' ? 'select' : 'newarea'; renderAll(); } }, 'New area'), h('button', { onclick: () => { fitView(); drawMap(); } }, 'Fit'),
    h('button', { onclick: pictureDialog }, S.map.image ? 'Picture…' : 'Set picture…')));
  if (S.blocked) tb.append(h('span', { class: 'dim small' }, `${(S.blocked.count / (S.blocked.size * S.blocked.size) * 100).toFixed(1)} % blocked`));
}
async function renameMap() {
  const inp = h('input', { value: S.map.map.name || '', size: 30, maxlength: 60 });
  const ok = await confirmBox('Name this map', h('div', {}, h('p', { class: 'dim small' }, 'The server has no map names (the client shows them). This name is kept for the page only and changes nothing in the game.'), inp), 'Save');
  if (!ok) return;
  try { await api('POST', `/maps/${S.mapId}/name`, { name: inp.value }); await reloadMap(); } catch (e) { toast(e.message, true); }
  renderAll(); drawMapList();
}
async function pictureDialog() {
  const im = S.map.image, size = S.map.map.size;
  const file = h('input', { type: 'file', accept: 'image/png,image/jpeg' });
  const f = {}; for (const [k, d] of [['x1', im ? im.x1 : 0], ['z1', im ? im.z1 : 0], ['x2', im ? im.x2 : size], ['z2', im ? im.z2 : size]]) f[k] = h('input', { type: 'number', value: d, style: 'width:90px', step: 'any' });
  const body = h('div', {}, h('p', { class: 'small dim' }, 'A PNG or JPEG up to 8 MB. Say which world rectangle it shows: its left edge is x1, its right edge x2, its top z1 and its bottom z2 (swap them to flip an axis). Then check that the spawn areas and NPCs line up with it.'),
    h('div', { class: 'row' }, file), h('div', { class: 'row' }, 'x1 ', f.x1, ' x2 ', f.x2, ' z1 (top) ', f.z1, ' z2 (bottom) ', f.z2), im ? h('p', { class: 'small dim' }, `Now: from ${im.source}, ${String(im.added_at).slice(0, 16)}`) : '');
  const buttons = [h('button', { onclick: closeModal }, 'Cancel')];
  if (im) buttons.push(h('button', { class: 'danger', onclick: async () => { try { await api('DELETE', `/maps/${S.mapId}/image`); closeModal(); await reloadMap(); S.img = null; renderAll(); } catch (e) { toast(e.message, true); } } }, 'Remove picture'));
  buttons.push(h('button', { class: 'primary', onclick: async () => {
    const rect = Object.fromEntries(Object.entries(f).map(([k, i]) => [k, +i.value]));
    try {
      let data;
      if (file.files[0]) {
        if (file.files[0].size > 8 * 1024 * 1024) throw new Error('the file is larger than 8 MB');
        data = await new Promise((res, rej) => { const rd = new FileReader(); rd.onload = () => res(String(rd.result).split(',')[1]); rd.onerror = () => rej(new Error('cannot read the file')); rd.readAsDataURL(file.files[0]); });
      } else if (im) {
        // only the rectangle changes: fetch the stored picture again
        const blob = await (await fetch(`/api/maps/${S.mapId}/image`)).blob();
        data = await new Promise((res) => { const rd = new FileReader(); rd.onload = () => res(String(rd.result).split(',')[1]); rd.readAsDataURL(blob); });
      } else throw new Error('choose a picture');
      await api('POST', `/maps/${S.mapId}/image`, { data, ...rect, source: file.files[0] ? file.files[0].name : im.source });
      closeModal(); await reloadMap(); S.img = null; fitView(); loadPictures(S.mapId); renderAll();
    } catch (e) { toast(e.message, true); }
  } }, 'Save'));
  modal('Background picture', body, buttons);
}

const TABS = [['monsters', 'Monsters'], ['spawns', 'Spawns'], ['portals', 'Portals'], ['bosses', 'Obelisks & bosses'], ['npcs', 'NPCs'], ['items', 'Items & grades']];
function renderPanel() {
  const tabs = $('#tabs'), body = $('#body');
  const top = body.scrollTop;
  tabs.replaceChildren(...TABS.map(([k, label]) => h('button', { class: S.tab === k ? 'on' : '', onclick: () => { S.tab = k; renderPanel(); } }, label)));
  const b = h('div');
  ({ monsters: monstersTab, spawns: spawnsTab, portals: portalsTab, bosses: bossesTab, npcs: npcsTab, items: itemsTab })[S.tab](b);
  body.replaceChildren(b);
  body.scrollTop = top;
}
function renderAll() {
  drawMapList(); drawToolbar(); renderPanel(); drawDraftBar(); drawMap();
}

// ---------------------------------------------------------------- start
$('#who').value = (() => { try { return localStorage.getItem('editor.who') || ''; } catch (e) { return ''; } })();
$('#who').addEventListener('change', () => { try { localStorage.setItem('editor.who', $('#who').value); } catch (e) { /* ignore */ } });
$('#mapfilter').addEventListener('input', (e) => { S.filter = e.target.value.trim(); drawMapList(); });
$('#b-servers').addEventListener('click', openServers);
$('#b-history').addEventListener('click', openHistory);
(async function start() {
  try {
    const [targets, maps, edits, draft] = await Promise.all([api('GET', '/targets'), api('GET', '/maps'), api('GET', '/edits'), api('GET', '/draft')]);
    for (const t of targets) S.targets[t.name] = t;
    S.maps = maps; S.edits = edits; S.draft = draft; indexDraft();
  } catch (e) { document.body.prepend(h('div', { class: 'note warn' }, 'Cannot reach the editor: ' + e.message)); return; }
  let last = null; try { last = +localStorage.getItem('editor.map'); } catch (e) { /* ignore */ }
  const initial = new URLSearchParams(location.search).get('map');
  const id = initial != null ? +initial : S.maps.some((m) => m.id === last) ? last : 2;
  renderAll();
  await loadMap(S.maps.some((m) => m.id === id) ? id : S.maps[0].id);
  if (new URLSearchParams(location.search).get('mob')) openMob(+new URLSearchParams(location.search).get('mob'));
})();
</script>
</body>
</html>
