[package]
name = "game-server"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dotenvy = "0.15.7"
mlua = { version = "0.12.2", features = ["lua51", "vendored", "send"] }
rand = "0.9"
shaiya-crypto = { version = "0.2.0", path = "../shaiya-crypto" }
shaiya-proto = { version = "0.2.0", path = "../shaiya-proto" }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
proptest = "1.12.0"
rand = "0.9"
sha2 = "0.11.1"
