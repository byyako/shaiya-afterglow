# Builds the Linux binaries when a version tag is pushed (git tag v0.2.0 && git push origin v0.2.0) and attaches them to a GitHub
# release, so that people can run the server without installing Rust (tools/fetch-release.sh downloads them).
# Built on Ubuntu 22.04 so that they run on any distribution with a glibc of 2.35 or newer.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:            # Actions > Release > Run workflow: rewrites the text of an existing release from CHANGELOG.md
    inputs:
      tag:
        description: "The release to update, for example v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  linux:
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release --workspace
      - name: package
        run: |
          name="shaiya-afterglow-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir "$name"
          for bin in login-server game-server servers create_account console data-editor mall; do
            install -m 755 "target/release/$bin" "$name/"
          done
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: release text
        run: tools/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md \
            "shaiya-afterglow-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" "shaiya-afterglow-${GITHUB_REF_NAME}-linux-x86_64.tar.gz.sha256" \
            || gh release upload "$GITHUB_REF_NAME" --clobber \
            "shaiya-afterglow-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" "shaiya-afterglow-${GITHUB_REF_NAME}-linux-x86_64.tar.gz.sha256"

  notes:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: rewrite the release text
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          tools/release-notes.sh "$TAG" > release-notes.md
          gh release edit "$TAG" --notes-file release-notes.md
