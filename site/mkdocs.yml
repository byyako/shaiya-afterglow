site_name: Shaiya internals
site_description: Reverse-engineering notes on the Shaiya EP4.5 server programs, the US client, the protocol and the game rules, and the open-source server built from them
docs_dir: build/docs
site_dir: dist
use_directory_urls: true

theme:
  name: material
  custom_dir: overrides   # overrides/main.html: the "Buy me a coffee" link
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Switch to light mode }

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

extra_css:
  - extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/byyako/shaiya-afterglow
      name: The open-source server on GitHub
    - icon: simple/buymeacoffee
      link: https://buymeacoffee.com/tylernol
      name: Buy me a coffee

plugins:
  - search

# report links to missing pages and missing #anchors
validation:
  unrecognized_links: warn
  anchors: warn


