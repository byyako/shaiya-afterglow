[workspace]
resolver = "3"
members = ["crates/shaiya-crypto", "crates/shaiya-proto", "crates/login-server", "crates/game-server", "crates/data-editor"]

[workspace.package]
edition = "2024"
# sqlx 0.9 needs 1.94 (README, "What you need")
rust-version = "1.94"
version = "0.2.0"
license = "MIT"
publish = false

[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
