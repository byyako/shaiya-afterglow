[workspace]
resolver = "3"
members = ["crates/shaiya-crypto", "crates/shaiya-proto", "crates/login-server", "crates/game-server", "crates/data-editor"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
