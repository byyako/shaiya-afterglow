# The Kill Boost Stones: the server's own definition rows (docs/plans/ext-1-foundation.md section 6; they were
# tools/defs/additions.sql and tools/sdata/client_rows.sql before version 0.3.0).
#
# Items 100/212, 100/213 and 100/214 (the empty "???177" of both copies of Item.SData) give skill 200 levels 1, 2 and 3 (empty "??";
# 200/100 stays the monsters' Weakening Curse). Each skill is a copy of the Mini Sun EXP Stone's 250/1 (a kind-4 buff, detail 82)
# without its ability, lasting one hour and kept on death (fixrange 1: keeptime in hours, counting down while offline). They do nothing
# by themselves: the multipliers are the setting kill_boost_skills below, so the kills counted are 2, 5 and 10 times while the level is
# applied. Each item is a copy of the Mini Sun EXP Stone 100/108 and puts its level in `attacktime` (the skill's level) and 200 in
# `range` (the skill id). Disabled, the stones and buffs stay and count 1 times.
#
# Why they exist: docs/plans/done/client-patches.md decision 1 and docs/original/operator-console.md decision 3 (research entry 7).
# Client side: Item.SData 100/212 to 214 and Skill.SData 200 levels 1 to 3 with the same values and the names and texts of rows.toml,
# in the first client data patch (109).

format = 1
name = "kill-boost"
version = "1.0.0"
title = "Kill Boost Stones"
description = "Three stones whose buff multiplies player kills (2x, 5x, 10x) for one hour."
authors = ["Shaiya Afterglow"]
license = "MIT"

[ids]
items = ["100/212-214"]
skills = ["200/1-3"]

[settings]
kill_boost_skills = "200/1:2,200/2:5,200/3:10"
